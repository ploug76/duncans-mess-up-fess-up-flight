for(let i=l+2.6;i<l+w;i+=4){R('rgba(0,0,0,.55)',i,tp,.45,h)}for(let j=tp+2.6;j<tp+h;j+=4){R('rgba(0,0,0,.45)',l,j,w,.45)}x.restore()};
// dark trousers & shoes
R('#1c1c22',-6,20,4.6,8);R('#1c1c22',1.4,20,4.6,8);R('#000',-7,27,5.6,2);R('#000',1.4,27,5.6,2);

for(const d of[-1,1]){x.strokeStyle='#15151b';x.lineWidth=5*s;x.lineCap='round';x.beginPath();x.moveTo(d*9*s,2*s);x.lineTo(d*17*s,9*s);x.stroke();

// white shirt V with studs, tartan waistcoat
poly('#fff',[-5,0,5,0,0,10]);dot('#222',0,4.2,.5);dot('#222',0,6.6,.5);
tartan([-5.5,6,-2,6,0,10,2,6,5.5,6,5,13,-5,13],-6,5,12,9);

poly('#2a2a33',[-5,0,-1.5,6,-5.5,6]);poly('#2a2a33',[5,0,1.5,6,5.5,6]);

// Black Watch kilt
tartan([-8.5,12.5,8.5,12.5,10.5,22.5,-10.5,22.5],-11,12,22,11);
x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=.5*s;for(const k of[-6,-3,0,3,6]){x.beginPath();x.moveTo(k*s,14*s);x.lineTo(k*1.2*s,22.5*s);x.stroke()}
// chain belt + sporran with silver tassels
x.strokeStyle='#c9ccd1';x.lineWidth=.8*s;x.beginPath();x.moveTo(-8.5*s,12.6*s);x.quadraticCurveTo(0,14.6*s,8.5*s,12.6*s);x.stroke();
x.fillStyle='#3a2416';x.beginPath();x.ellipse(0,17*s,3.8*s,4.4*s,0,0,7);x.fill();x.fillStyle='#d9dde2';x.beginPath();x.ellipse(0,13.9*s,3.4*s,1.5*s,0,0,7);x.fill();
for(const k of[-1.8,0,1.8]){R('#e6e8eb',k-.25,16,.5,2.2);poly('#f4f5f7',[k,17.6,k-.8,20.2,k+.8,20.2])}
// neck, head
R('#f2c9a8',-2.2,-2,4.4,3);dot('#f2c9a8',0,-9,9);dot('#f2c9a8',-8.8,-8.6,1.6);dot('#f2c9a8',8.8,-8.6,1.6);
// short white hair
x.fillStyle='#f1f1f1';x.beginPath();x.arc(0,-10.5*s,9.4*s,Math.PI*1.03,Math.PI*1.97);x.quadraticCurveTo(4*s,-15.8*s,0,-15.4*s);x.quadraticCurveTo(-5*s,-15.8*s,-9.2*s,-12*s);x.fill();
R('#e4e4e6',-9.4,-13,2.2,4.5);R('#e4e4e6',7.2,-13,2.2,4.5);
// cheeks, eyes, glasses, warm smile
dot('rgba(240,130,120,.35)',-5.4,-5.2,1.8);dot('rgba(240,130,120,.35)',5.4,-5.2,1.8);
R('#333',-4.6,-9.4,1.8,1.8);R('#333',2.8,-9.4,1.8,1.8);
x.strokeStyle='#8a7a5a';x.lineWidth=.9*s;x.beginPath();x.roundRect?x.roundRect(-7.2*s,-11.4*s,6*s,4.6*s,1.6*s):x.rect(-7.2*s,-11.4*s,6*s,4.6*s);x.stroke();
x.beginPath();x.roundRect?x.roundRect(1.2*s,-11.4*s,6*s,4.6*s,1.6*s):x.rect(1.2*s,-11.4*s,6*s,4.6*s);x.stroke();x.beginPath();x.moveTo(-1.2*s,-9.6*s);x.lineTo(1.2*s,-9.6*s);x.stroke();
x.strokeStyle='#7a4232';x.lineWidth=.8*s;x.lineCap='round';x.beginPath();x.arc(0,-5.4*s,2.8*s,.22*Math.PI,.78*Math.PI);x.stroke();
// halo glow (unchanged)
x.strokeStyle='#ffd700';x.lineWidth=3*s;x.shadowColor='#fff38a';x.shadowBlur=15*s;
x.beginPath();x.ellipse(0,-26*s,11*s,4*s,0,0,7);x.stroke();x.restore()}
function sky(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,state=='end'?'#fff8dc':'#7fb3ff');g.addColorStop(.6,'#ffd6ec');g.addColorStop(1,'#fff3c4');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='rgba(255,255,255,.8)';for(const cl of clouds){cl.x-=.0004*cl.s;if(cl.x<-.3)cl.x=1.2;const cx=cl.x*W,cy=cl.y*H,r=30*S*cl.s;for(let i=0;i<4;i++){x.beginPath();x.arc(cx+i*r*.8,cy+(i%2)*r*.3,r,0,7);x.fill()}}}
function txt(s,y,sz,col){x.lineJoin='round';x.font=`bold ${sz*S}px Georgia`;x.textAlign='center';x.textBaseline='middle';x.lineWidth=5*S;x.strokeStyle='rgba(80,50,0,.6)';x.strokeText(s,W/2,y,W*.95);x.fillStyle=col||'#fff8d0';x.fillText(s,W/2,y,W*.95)}
function heavenBook(h){x.save();x.translate(h.x,h.y);x.shadowColor='#ffe066';x.shadowBlur=40*S+10*S*Math.sin(t*.1);x.fillStyle='#f5c518';x.fillRect(-30*S,-38*S,60*S,76*S);x.shadowBlur=0;x.fillStyle='#fff6c0';x.fillRect(-24*S,-30*S,48*S,60*S);
x.fillStyle='#b8860b';x.fillRect(-3*S,-20*S,6*S,36*S);x.fillRect(-12*S,-10*S,24*S,6*S);x.font=`bold ${9*S}px Georgia`;x.textAlign='center';x.fillText('BOOK OF',0,20*S);x.fillText('HEAVEN',0,29*S);x.restore()}
function die(){state='dead';msgT=40;for(let i=0;i<20;i++)parts.push({x:a.x,y:a.y,vx:(Math.random()-.5)*6*S,vy:(Math.random()-.5)*6*S,l:60,c:'#fff'})}
function step(){t++;sky();const p=P();
if(state=='title'){angel(W/2,H*.42+Math.sin(t*.05)*10*S,1);txt("Duncan's Mess Up",H*.15,32);txt("Fess Up Flight",H*.2,32);txt('Help Duncan fly through the laws & rules',H*.28,17);txt('and find the Book of Heaven',H*.32,17);txt('Tap to begin — Level '+level+' / 99',H*.6,22);}
else if(state=='play'||state=='dead'){
if(state=='play'){a.v+=.42*S;a.y+=a.v;
if(passed+obs.length<need&&--spawnT<=0){spawnT=p.int;const gap=p.gap;obs.push({x:W,w:70*S,gap,top:H*.12+Math.random()*(H*.76-gap),s:Math.floor(Math.random()*9),done:0})}
if(passed>=need&&!obs.length&&!heaven)heaven={x:W+40*S,y:H*.3+Math.random()*H*.4};

if(state=='play'&&a.x+12*S>o.x&&a.x-12*S<o.x+o.w&&(a.y-14*S<o.top||a.y+20*S>o.top+o.gap))die()}

obs.forEach(pillar);if(heaven)heavenBook(heaven);if(state=='play')angel(a.x,a.y,1);

if(state=='play'&&msgT-->0){txt('Level '+level,H*.45,40);if(lvlMsg)txt(lvlMsg,H*.52,18)}
if(state=='dead'){msgT--;txt('The law caught Duncan…',H*.4,28);txt(msgT>0?'':'Tap Forgiveness to try again',H*.48,20)}}
else if(state=='end'){endT++;const al=Math.max(0,1-Math.max(0,endT-200)/120);a.y-=1.2*S;if(al>0)angel(a.x,a.y,al);

for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.l--;x.globalAlpha=Math.max(0,q.l/100);x.fillStyle=x.strokeStyle=q.c;if(q.str){x.lineWidth=1.5*S;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-q.vx*4,q.y-q.vy*6);x.stroke()}else x.fillRect(q.x,q.y,3*S,3*S)}
